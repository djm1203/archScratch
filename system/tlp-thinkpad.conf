# archScratch - ThinkPad (T480) TLP drop-in -> /etc/tlp.d/01-archscratch.conf
# Battery care: only charge between 75-80% (set BOTH start and stop or neither applies).
# T480: BAT0 = internal, BAT1 = hot-swap; confirm with `tlp-stat -b`. Full charge once: `sudo tlp fullcharge BAT0`.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=80

# Keep the fingerprint reader (06cb:009a) from being USB-autosuspended.
USB_DENYLIST="06cb:009a"
